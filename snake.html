<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f1a;
    color: #e0e0e0;
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    user-select: none;
  }
  .game-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 20px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 500px;
  }
  .score-box { font-size: 18px; font-weight: 600; color: #a0a0c0; }
  .score-box span { color: #f0e68c; font-size: 22px; }
  .best-box { font-size: 14px; color: #6a6a8a; }
  .best-box span { color: #7ec8e3; }
  canvas {
    border: 2px solid #2a2a4a;
    border-radius: 8px;
    background: #1a1a2e;
    display: block;
    width: 100%;
    max-width: 500px;
    height: auto;
    aspect-ratio: 1 / 1;
    image-rendering: pixelated;
    touch-action: none;
  }
  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .controls-row { display: flex; gap: 6px; }
  .ctrl-btn {
    width: 56px;
    height: 56px;
    border: 1px solid #3a3a5a;
    border-radius: 10px;
    background: #1e1e36;
    color: #c0c0e0;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: none;
    transition: background 0.1s;
  }
  .ctrl-btn:active { background: #32325a; }
  .ctrl-btn.blank { visibility: hidden; }
  .status {
    font-size: 14px;
    color: #707090;
    text-align: center;
    min-height: 20px;
  }
  .status .restart {
    color: #7ec8e3;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  @media (max-width: 520px) {
    .game-wrapper { gap: 12px; padding: 12px; }
    .ctrl-btn { width: 48px; height: 48px; font-size: 18px; }
  }
</style>
</head>
<body>
<div class="game-wrapper">
  <div class="header">
    <div class="score-box">🐍 得分 <span id="score">0</span></div>
    <div class="best-box">🏆 最高 <span id="best">0</span></div>
  </div>
  <canvas id="gameCanvas" width="500" height="500"></canvas>
  <div class="status" id="status">按方向键或 WASD 开始游戏</div>
  <div class="controls" id="touchControls">
    <div class="controls-row">
      <div class="ctrl-btn blank"></div>
      <div class="ctrl-btn" data-dir="up">▲</div>
      <div class="ctrl-btn blank"></div>
    </div>
    <div class="controls-row">
      <div class="ctrl-btn" data-dir="left">◀</div>
      <div class="ctrl-btn" data-dir="down">▼</div>
      <div class="ctrl-btn" data-dir="right">▶</div>
    </div>
  </div>
</div>
<script>
(function(){
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const statusEl = document.getElementById("status");
  const GRID = 20;
  const CELL = canvas.width / GRID;
  let snake, direction, nextDir, food, score, best, gameOver, win, running, timer, speed;
  best = parseInt(localStorage.getItem("snakeBest") || "0", 10);
  bestEl.textContent = best;


  function randInt(m) { return Math.floor(Math.random() * m); }
  function spawnFood() {
    const occ = new Set(snake.map(p => p.x+","+p.y));
    const free = [];
    for (let y = 0; y < GRID; y++) for (let x = 0; x < GRID; x++) if (!occ.has(x+","+y)) free.push({x,y});
    if (!free.length) { win = true; return false; }
    food = free[randInt(free.length)];
    return true;
  }
  function resetGame() {
    if (timer) { clearTimeout(timer); timer = null; }
    const m = Math.floor(GRID/2);
    snake = [{x:m,y:m},{x:m-1,y:m},{x:m-2,y:m}];
    direction = {x:1,y:0}; nextDir = {x:1,y:0};
    score = 0; gameOver = false; win = false; running = true; speed = 120;
    scoreEl.textContent = "0";
    statusEl.innerHTML = "&nbsp;";
    spawnFood(); draw(); scheduleTick();
  }
  function scheduleTick() { if (running) timer = setTimeout(tick, speed); }
  function tick() {
    if (!running || gameOver || win) { draw(); return; }
    direction = { ...nextDir };
    const h = snake[0], nh = {x:h.x+direction.x, y:h.y+direction.y};
    if (nh.x<0||nh.x>=GRID||nh.y<0||nh.y>=GRID) return endGame("撞墙了...");
    if (snake.some(p=>p.x===nh.x&&p.y===nh.y)) return endGame("咬到自己了...");
    snake.unshift(nh);
    if (nh.x===food.x&&nh.y===food.y) {
      score++; scoreEl.textContent = score;
      if (score>best) { best=score; localStorage.setItem("snakeBest",""+best); bestEl.textContent=best; }
      if (!spawnFood()) { win=true; running=false; statusEl.innerHTML="🎉 你赢了！<span class=\"restart\" id=\"restartLink\">再来一局</span>"; bindRestart(); draw(); return; }
      if (score%5===0&&speed>60) speed-=6;
    } else snake.pop();
    draw();
    if (!gameOver&&!win) scheduleTick();
  }
  function endGame(msg) {
    gameOver=true; running=false;
    statusEl.innerHTML="💀 "+msg+" 得分 "+score+" <span class=\"restart\" id=\"restartLink\">再来一局</span>";
    bindRestart(); draw();
  }
  function bindRestart() { var el=document.getElementById("restartLink"); if(el) el.addEventListener("click",resetGame); }
  function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle="#22223a"; ctx.lineWidth=0.5;
    for(var i=0;i<=GRID;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,canvas.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(canvas.width,i*CELL);ctx.stroke();}
    snake.forEach(function(p,idx){
      var x=p.x*CELL,y=p.y*CELL,pad=1,rad=4;
      if(idx===0){
        ctx.fillStyle="#6fcf97";ctx.shadowColor="#6fcf9780";ctx.shadowBlur=8;
        roundRect(ctx,x+pad,y+pad,CELL-pad*2,CELL-pad*2,rad);ctx.fill();ctx.shadowBlur=0;
        ctx.fillStyle="#1a1a2e";var es=3,e1,e2;
        if(direction.x===1){e1=[x+12,y+5];e2=[x+12,y+12];}else if(direction.x===-1){e1=[x+5,y+5];e2=[x+5,y+12];}else if(direction.y===-1){e1=[x+5,y+5];e2=[x+12,y+5];}else{e1=[x+5,y+12];e2=[x+12,y+12];}
        ctx.beginPath();ctx.arc(e1[0],e1[1],es,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(e2[0],e2[1],es,0,Math.PI*2);ctx.fill();
      }else{
        var t=idx/snake.length;
        ctx.fillStyle="rgb("+Math.round(40+60*(1-t))+","+Math.round(180-40*t)+","+Math.round(120-40*t)+")";
        roundRect(ctx,x+pad,y+pad,CELL-pad*2,CELL-pad*2,rad);ctx.fill();
      }
    });
    var fx=food.x*CELL,fy=food.y*CELL,pulse=Math.sin(Date.now()/200)*0.12+0.88,s=CELL*pulse;
    ctx.fillStyle="#e74c3c";ctx.shadowColor="#e74c3c80";ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(fx+CELL/2,fy+CELL/2,s/2-1,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    if(win){ctx.fillStyle="rgba(26,26,46,0.6)";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#f0e68c";ctx.font="bold 32px \"Segoe UI\",system-ui,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("🏆 胜利",canvas.width/2,canvas.height/2);}
    else if(gameOver){ctx.fillStyle="rgba(26,26,46,0.5)";ctx.fillRect(0,0,canvas.width,canvas.height);}
  }
  function setDir(dx,dy){if(!running||gameOver||win)return;if(direction.x===-dx&&direction.y===-dy)return;nextDir={x:dx,y:dy};if(!timer)scheduleTick();}
  document.addEventListener("keydown",function(e){
    var k=e.key;
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","w","W","s","S","a","A","d","D"].indexOf(k)>-1)e.preventDefault();
    if(!running){if(k===" "||k==="Enter")resetGame();return;}
    switch(k){case"ArrowUp":case"w":case"W":setDir(0,-1);break;case"ArrowDown":case"s":case"S":setDir(0,1);break;case"ArrowLeft":case"a":case"A":setDir(-1,0);break;case"ArrowRight":case"d":case"D":setDir(1,0);break;case" ":resetGame();break;}
  });
  document.querySelectorAll(".ctrl-btn[data-dir]").forEach(function(btn){btn.addEventListener("click",function(){var d=btn.dataset.dir;if(!running){resetGame();return;}switch(d){case"up":setDir(0,-1);break;case"down":setDir(0,1);break;case"left":setDir(-1,0);break;case"right":setDir(1,0);break;}});btn.addEventListener("touchstart",function(e){e.preventDefault();btn.click();});});
  var touchStart=null;canvas.addEventListener("touchstart",function(e){e.preventDefault();touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};});canvas.addEventListener("touchmove",function(e){e.preventDefault();});canvas.addEventListener("touchend",function(e){if(!touchStart)return;var t=e.changedTouches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;touchStart=null;if(Math.abs(dx)<15&&Math.abs(dy)<15)return;setDir(dx>0?1:-1,0);if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);else setDir(0,dy>0?1:-1);});
  var m=Math.floor(GRID/2);snake=[{x:m,y:m},{x:m-1,y:m},{x:m-2,y:m}];running=false;direction={x:1,y:0};nextDir={x:1,y:0};draw();
  setInterval(function(){if(running&&!gameOver&&!win)draw();},100);
  window.resetSnake=resetGame;
})();
</script>
</body>
</html>
